name: Sync & Order Releases

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      realign:
        description: 'Force realign GitHub releases order'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  sync-and-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify release ordering
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run sync

      - name: Realign releases if requested
        if: "${{ github.event.inputs.realign == 'true' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run realign
